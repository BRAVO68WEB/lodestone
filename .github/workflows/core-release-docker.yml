name: Core - Release Docker

# Replaced by release-docker.yml. This file stays so old links to the workflow
# name do not 404, and it no longer publishes ghcr.io/lodestone-team/lodestone_core.

on:
  workflow_dispatch:

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: retired
        run: echo "Core images are published by .github/workflows/release-docker.yml as ghcr.io/bravo68web/lodestone"
