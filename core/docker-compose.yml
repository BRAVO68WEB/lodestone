# The supported install is the all-in-one image at the repository root.
# This file matches docker-compose.yml there.
services:
  lodestone:
    image: ghcr.io/bravo68web/lodestone:latest
    restart: unless-stopped
    ports:
      - "8080:80"
      - "25565:25565"
    volumes:
      - lodestone:/var/lib/lodestone

volumes:
  lodestone:
